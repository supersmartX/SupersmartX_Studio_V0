<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mediabunny real SuperSmartX recording POC</title>
  <style>
    body { background: #0b0b0d; color: #e7e7eb; font: 14px system-ui, sans-serif; max-width: 960px; margin: 28px auto; padding: 0 16px; }
    button { background: #633cff; border: 0; border-radius: 6px; color: white; cursor: pointer; padding: 9px 13px; }
    button:disabled { cursor: wait; opacity: .55; }
    pre { background: #151519; border: 1px solid #2b2b33; border-radius: 8px; padding: 12px; white-space: pre-wrap; }
    video { background: #050505; max-width: 100%; }
  </style>
</head>
<body>
  <h1>Real SuperSmartX WebM → Mediabunny MP4 POC</h1>
  <p>Captures a real browser MediaRecorder stream, then converts VP9/Opus WebM to H.264/AAC MP4.</p>
  <button id="run">Capture and run matrix</button>
  <pre id="log">Ready.</pre>
  <script type="module">
    import {
      ALL_FORMATS,
      AudioSampleSink,
      BlobSource,
      BufferTarget,
      Conversion,
      Input,
      Mp4OutputFormat,
      Output,
      Quality,
      VideoSampleSink,
    } from 'https://cdn.jsdelivr.net/npm/mediabunny@1.59.0/+esm';

    const logNode = document.querySelector('#log');
    const log = (value) => { logNode.textContent += `${typeof value === 'string' ? value : JSON.stringify(value, null, 2)}\n`; };
    const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    function pickMimeType() {
      const candidates = [
        'video/webm;codecs=vp9,opus',
        'video/webm;codecs=vp8,opus',
        'video/webm',
      ];
      return candidates.find((type) => MediaRecorder.isTypeSupported(type)) || '';
    }

    async function loadMetadata(blob) {
      const input = new Input({ source: new BlobSource(blob), formats: ALL_FORMATS });
      const tracks = await input.getTracks();
      const videoTrack = await input.getPrimaryVideoTrack();
      const audioTrack = await input.getPrimaryAudioTrack();
      return {
        tracks: tracks.length,
        duration: await input.computeDuration(),
        mimeType: blob.type,
        bytes: blob.size,
        video: videoTrack ? {
          codec: await videoTrack.getCodec(),
          width: await videoTrack.getDisplayWidth(),
          height: await videoTrack.getDisplayHeight(),
          canDecode: await videoTrack.canDecode(),
        } : null,
        audio: audioTrack ? {
          codec: await audioTrack.getCodec(),
          channels: await audioTrack.getNumberOfChannels(),
          sampleRate: await audioTrack.getSampleRate(),
          canDecode: await audioTrack.canDecode(),
        } : null,
      };
    }

    async function captureRealRecording(seconds) {
      const mimeType = pickMimeType();
      if (!mimeType) throw new Error('No supported VP9/Opus or WebM MediaRecorder type');
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 30 } },
        audio: true,
      });
      const chunks = [];
      const recorder = new MediaRecorder(stream, { mimeType });
      const stopped = new Promise((resolve, reject) => {
        recorder.ondataavailable = (event) => { if (event.data.size > 0) chunks.push(event.data); };
        recorder.onerror = () => reject(recorder.error || new Error('MediaRecorder failed'));
        recorder.onstop = resolve;
      });
      recorder.start(100);
      await wait(seconds * 1000);
      recorder.stop();
      await stopped;
      stream.getTracks().forEach((track) => track.stop());
      const blob = new Blob(chunks, { type: mimeType });
      const metadata = await loadMetadata(blob);
      return { blob, metadata };
    }

    function drawComposition(canvas, context, sample, width, height, watermark) {
      canvas.width = width;
      canvas.height = height;
      context.fillStyle = '#101116';
      context.fillRect(0, 0, width, height);
      sample.draw(context, 0, 0, width, height);
      if (watermark) {
        context.save();
        context.font = `bold ${Math.max(18, Math.round(width * 0.03))}px sans-serif`;
        context.textAlign = 'right';
        context.fillStyle = 'rgba(0,0,0,.5)';
        context.fillRect(width - 190, height - 44, 170, 28);
        context.fillStyle = 'rgba(255,255,255,.9)';
        context.fillText('SupersmartX', width - 32, height - 24);
        context.restore();
      }
      return canvas;
    }

    async function convertWithMediabunny(blob, width, height, watermark, signal) {
      const input = new Input({ source: new BlobSource(blob), formats: ALL_FORMATS });
      const output = new Output({ format: new Mp4OutputFormat(), target: new BufferTarget() });
      const canvas = document.createElement('canvas');
      const context = canvas.getContext('2d');
      if (!context) throw new Error('Canvas context unavailable');
      const conversion = await Conversion.init({
        input,
        output,
        tracks: 'primary',
        video: {
          codec: 'avc',
          width,
          height,
          fit: 'cover',
          quality: new Quality('medium'),
          forceTranscode: true,
          processedWidth: width,
          processedHeight: height,
          process: (sample) => drawComposition(canvas, context, sample, width, height, watermark),
        },
        audio: { codec: 'aac', quality: new Quality('medium'), forceTranscode: true },
        showWarnings: false,
      });
      if (!conversion.isValid) throw new Error(`Conversion invalid: ${conversion.discardedTracks.map((item) => item.reason).join(', ')}`);
      conversion.onProgress = (progress, processedTime) => log(`${width}x${height} ${watermark ? 'FREE' : 'CREATOR'} progress=${(progress * 100).toFixed(0)}% time=${processedTime.toFixed(2)}s`);
      const cancelTimer = setTimeout(() => { if (signal?.aborted) conversion.cancel(); }, 0);
      try { await conversion.execute({ pauseSignal: signal }); } finally { clearTimeout(cancelTimer); }
      const buffer = output.target.buffer;
      if (!buffer) throw new Error('Mediabunny produced no output buffer');
      return new Blob([buffer], { type: 'video/mp4' });
    }

    async function measureAudio(blob) {
      const input = new Input({ source: new BlobSource(blob), formats: ALL_FORMATS });
      const track = await input.getPrimaryAudioTrack();
      if (!track) return { present: false };
      const sink = new AudioSampleSink(track);
      const sample = await sink.getSample(0);
      if (!sample) return { present: true, audible: false };
      const buffer = sample.toAudioBuffer();
      let sum = 0;
      let count = 0;
      for (let channel = 0; channel < buffer.numberOfChannels; channel++) {
        const data = buffer.getChannelData(channel);
        for (let i = 0; i < data.length; i += 16) { sum += Math.abs(data[i]); count++; }
      }
      return { present: true, audible: count > 0 && sum / count > 0.00001, channels: buffer.numberOfChannels, sampleRate: buffer.sampleRate };
    }

    async function inspectOutput(blob) {
      const metadata = await loadMetadata(blob);
      const audioMeasure = await measureAudio(blob);
      return {
        bytes: blob.size,
        duration: metadata.duration,
        video: metadata.video,
        audio: { ...metadata.audio, measured: audioMeasure },
        playableInChromium: await new Promise((resolve) => {
          const video = document.createElement('video');
          const url = URL.createObjectURL(blob);
          video.onloadedmetadata = () => { URL.revokeObjectURL(url); resolve(true); };
          video.onerror = () => { URL.revokeObjectURL(url); resolve(false); };
          video.src = url;
        }),
      };
    }

    async function runMatrix() {
      document.querySelector('#run').disabled = true;
      logNode.textContent = '';
      const results = { fixture: null, matrix: [], short: null, normal: null, cancellation: null };
      try {
        const shortRecording = await captureRealRecording(5);
        results.fixture = { durationTarget: 5, ...shortRecording.metadata };
        log({ realRecordingFixture: results.fixture });
        const dimensions = [[1920, 1080], [1280, 720], [1080, 1920], [1080, 1080], [1080, 1350]];
        for (const [width, height] of dimensions) {
          for (const watermark of [true, false]) {
            const blob = await convertWithMediabunny(shortRecording.blob, width, height, watermark);
            const report = await inspectOutput(blob);
            results.matrix.push({ width, height, watermark, report });
            log({ width, height, watermark: watermark ? 'FREE' : 'CREATOR', report });
          }
        }
        results.short = results.matrix.filter((item) => item.width === 1920 && item.height === 1080).map((item) => item.report);
        const normalRecording = await captureRealRecording(20);
        results.normalFixture = await loadMetadata(normalRecording.blob);
        const normalBlob = await convertWithMediabunny(normalRecording.blob, 1920, 1080, false);
        results.normal = await inspectOutput(normalBlob);
        log({ normalRecording: results.normalFixture, normalOutput: results.normal });
        const cancelController = new AbortController();
        const cancelPromise = convertWithMediabunny(normalRecording.blob, 1080, 1920, false, cancelController.signal);
        setTimeout(() => cancelController.abort(), 250);
        try { await cancelPromise; results.cancellation = { stopped: false }; }
        catch (error) { results.cancellation = { stopped: true, error: String(error) }; }
        window.pocResult = { ok: true, results };
        log('POC PASS: real recording conversion matrix completed.');
      } catch (error) {
        window.pocResult = { ok: false, error: String(error), stack: error?.stack, results };
        log(`POC FAIL: ${String(error)}`);
        console.error(error);
      } finally {
        document.querySelector('#run').disabled = false;
      }
    }

    window.runRealPoc = runMatrix;
    document.querySelector('#run').addEventListener('click', runMatrix);
  </script>
</body>
</html>
